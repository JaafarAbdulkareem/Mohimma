name: task_time
description: "A clean, production-ready Flutter task countdown app with Cubit,
  optional descriptions, task detail modal dialogs, saved tasks, and background alarms."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.8
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  flutter_local_notifications: ^19.4.0
  shared_preferences: ^2.5.3
  timezone: ^0.10.1

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
